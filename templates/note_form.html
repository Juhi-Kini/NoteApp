{% extends 'base.html' %}

{% block content %}
<div class="container mt-2 mt-md-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8">
      <div class="card shadow-sm">
        <div class="card-header bg-white">
          <h2 class="h4 mb-0">{{ '✏️ Edit Note' if note else '📝 Create New Note' }}</h2>
        </div>
        <div class="card-body">
          <form method="POST">
            <div class="mb-3">
              <label for="title" class="form-label fw-bold">Title</label>
              <input type="text" class="form-control form-control-lg" id="title" name="title" 
                     placeholder="Enter title" value="{{ note['title'] if note else '' }}" required>
            </div>
            
            <div class="mb-3">
              <label for="content" class="form-label fw-bold">Content</label>
              <textarea class="form-control" id="content" name="content" rows="8">{{ note['content']|safe if note else '' }}</textarea>
            </div>
            
            <div class="mb-3">
              <label for="tags" class="form-label fw-bold">Tags</label>
              <input type="text" class="form-control" id="tags" name="tags" 
                     placeholder="work, personal, idea" 
                     value="{{ note['tags']|join(', ') if note else '' }}">
              <div class="form-text small">Separate tags with commas</div>
            </div>
            
            <div class="d-flex flex-column flex-sm-row justify-content-between gap-2 mt-4">
              <a href="/dashboard" class="btn btn-secondary order-2 order-sm-1">← Cancel</a>
              <button type="submit" class="btn btn-primary order-1 order-sm-2">
                {{ '💾 Update Note' if note else '✨ Create Note' }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- CKEditor with mobile adjustments -->
{{ ckeditor.load() }}
<script>
  CKEDITOR.replace('content', {
    height: Math.min(400, window.innerHeight * 0.5),
    removePlugins: 'forms',
    toolbar: [
      ['Bold', 'Italic', 'Underline'],
      ['NumberedList', 'BulletedList'],
      ['Link', 'Unlink'],
      ['RemoveFormat', 'Source']
    ],
    toolbarGroups: [
      { name: 'basicstyles' },
      { name: 'list' },
      { name: 'links' },
      { name: 'tools' }
    ]
  });
  
  // Adjust editor on window resize
  window.addEventListener('resize', function() {
    if (CKEDITOR.instances.content) {
      CKEDITOR.instances.content.resize('100%', Math.min(400, window.innerHeight * 0.5));
    }
  });
</script>

<style>
  @media (max-width: 576px) {
    .form-control-lg {
      font-size: 1rem;
    }
    .btn {
      width: 100%;
      margin: 2px 0;
    }
    .card-body {
      padding: 1rem;
    }
  }
  .cke_chrome {
    border: 1px solid #ced4da !important;
    border-radius: 0.375rem !important;
  }
</style>
{% endblock %}
